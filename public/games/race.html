<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGT Street Race — Top Down LIVE</title>
    <link rel="stylesheet" href="/games/race.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🏎️ AGT STREET RACE</h1>
            <div class="game-stats">
                <div class="stat">
                    <span class="label">Speed:</span>
                    <span id="speed-display">0</span>
                    <span class="unit">km/h</span>
                </div>
                <div class="stat">
                    <span class="label">Tur:</span>
                    <span id="lap-display">1</span>
                    <span class="unit">/ 3</span>
                </div>
                <div class="stat">
                    <span class="label">Süre:</span>
                    <span id="time-display">00:00</span>
                </div>
                <div class="stat">
                    <span class="label">En İyi:</span>
                    <span id="best-time">--:--</span>
                </div>
            </div>
        </header>

        <div class="game-area">
            <canvas id="gameCanvas" width="1000" height="600"></canvas>
            
            <div class="game-controls">
                <div class="control-info">
                    <h3>🎮 Kontroller</h3>
                    <div class="controls-grid">
                        <div class="control">
                            <span class="key">↑ / W</span>
                            <span>Gaz</span>
                        </div>
                        <div class="control">
                            <span class="key">↓ / S</span>
                            <span>Fren</span>
                        </div>
                        <div class="control">
                            <span class="key">← / A</span>
                            <span>Sol</span>
                        </div>
                        <div class="control">
                            <span class="key">→ / D</span>
                            <span>Sağ</span>
                        </div>
                        <div class="control">
                            <span class="key">SPACE</span>
                            <span>Yeniden Başlat</span>
                        </div>
                    </div>
                </div>

                <div class="car-selection">
                    <h3>🚗 Araç Seç</h3>
                    <div class="car-options">
                        <button class="car-btn active" data-car="0">Sport Car</button>
                        <button class="car-btn" data-car="1">Race Car</button>
                        <button class="car-btn" data-car="2">Classic Car</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="game-overlay" id="gameOverlay">
            <div class="overlay-content">
                <h2 id="overlayTitle">Race Complete! 🏁</h2>
                <p id="overlayMessage">Great job!</p>
                <div class="overlay-stats">
                    <div class="stat-item">
                        <span class="stat-label">Final Time:</span>
                        <span id="finalTime">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Average Speed:</span>
                        <span id="avgSpeed">0 km/h</span>
                    </div>
                </div>
                <button id="restartBtn" class="restart-btn">🏎️ Race Again</button>
            </div>
        </div>
    </div>

<script src="/games/race.js"></script>\n</body>
</html>
