<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AGT Race — TikTok LIVE Top Down</title>
<link rel="stylesheet" href="/games/race.css">
</head>
<body>
<div class="stream">
  <section class="gift-zone top-zone">
    <div class="gift-title"><span>🎁</span><b>TIKTOK HEDİYELERİ</b><em>YARIŞ ETKİLERİ</em></div>
    <div class="gift-grid" id="giftTop"></div>
  </section>

  <section class="race-zone">
    <canvas id="raceCanvas" width="1080" height="720"></canvas>
    <div class="race-overlay">
      <div class="leaderboard glass">
        <div class="panel-head"><b>SIRALAMA</b><span id="lapText">TUR 1/3</span></div>
        <div id="leaderRows"></div>
      </div>
      <div class="race-state" id="raceState">KATILIM BEKLENİYOR</div>
      <div class="timer glass">
        <small>TUR SÜRESİ</small><strong id="raceTimer">00:00.000</strong>
        <span id="phaseText">Oyuncular bekleniyor</span>
      </div>
      <div class="mini-map glass"><canvas id="miniCanvas" width="180" height="120"></canvas></div>
      <div class="speed glass"><strong id="speedText">0</strong><span>km/h</span><b id="boostText">BOOST 0%</b></div>
    </div>
  </section>

  <section class="gift-zone bottom-zone">
    <div class="gift-title"><span>⚡</span><b>ARABANI GÜÇLENDİR</b><em>HEDİYE → HIZ / NİTRO</em></div>
    <div class="gift-grid" id="giftBottom"></div>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
window.AGT_RACE_CONFIG = {
  mode: new URLSearchParams(location.search).get("mode") || "demo",
  username: new URLSearchParams(location.search).get("username") || ""
};
</script>
<script src="/games/race.js"></script>
</body>
</html>
