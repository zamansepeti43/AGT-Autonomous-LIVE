<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGT Arena</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:system-ui;padding:20px}.top{display:flex;justify-content:space-between}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:35px}.p{background:rgba(12,16,23,.9);border:1px solid #303746;border-radius:18px;padding:18px;text-align:center}.avatar{font-size:50px}.points{font-size:30px;font-weight:900}.vote{margin-top:25px;padding:16px;border-radius:14px;background:rgba(0,0,0,.55);text-align:center}.feed{margin-top:15px;font-size:12px}</style></head><body><div class="top"><b>🏆 AGT LIVE ARENA</b><span id="timer">WAITING</span></div><div class="players" id="players"></div><div class="vote">Chat: <b>1 / 2 / 3</b> → güçlendirme oyu</div><div class="feed" id="feed"></div><script src="/socket.io/socket.io.js"></script><script>const s=io();let users=new Map(),votes={1:0,2:0,3:0};function draw(){const top=[...users.values()].sort((a,b)=>b.points-a.points).slice(0,3);players.innerHTML=[0,1,2].map(i=>{const x=top[i]||{name:'Bekliyor',points:0};return '<div class="p"><div class="avatar">'+['🚗','🏎️','🚙'][i]+'</div><b>'+(i+1)+'. '+x.name+'</b><div class="points">'+Math.round(x.points)+'💎</div></div>'}).join('');feed.innerHTML=Object.entries(votes).map(([k,v])=>'<div>Oy '+k+': '+v+'</div>').join('')}function event(e){const uid=e.user?.uniqueId||'x';if(e.type==='gift'){const v=(e.diamondCount||1)*(e.repeatCount||1);const old=users.get(uid)||{name:e.user?.nickname||uid,points:0};old.points+=v;users.set(uid,old);draw()}if(e.type==='chat'){const n=String(e.comment||'').trim();if(votes[n]!=null)votes[n]++;draw()}}s.on('live:event',event);setInterval(()=>{votes={1:0,2:0,3:0};draw()},10000);draw();</script></body></html>
