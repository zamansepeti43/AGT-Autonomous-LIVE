<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGT Tower</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:system-ui;padding:22px}.top{display:flex;justify-content:space-between;font-size:22px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:35px}.team{background:rgba(12,16,23,.9);border:1px solid #303746;border-radius:18px;padding:18px}.hp{height:28px;background:#080b10;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;transition:width .25s}.red .bar{background:#ff405f}.blue .bar{background:#3d8bff}.score{font-size:42px;font-weight:900}.feed{margin-top:18px;max-height:180px;overflow:hidden}.feed div{padding:7px;background:rgba(0,0,0,.55);margin:4px 0;border-radius:8px}.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.7);font-size:48px;font-weight:900}.hide{display:none}</style></head><body><div class="top"><b>⚔️ AGT TOWER BATTLE</b><span id="phase">LIVE</span></div><div class="teams"><div class="team red"><h2>🔴 KIRMIZI</h2><div class="score" id="r">1000</div><div class="hp"><div class="bar" id="rb" style="width:100%"></div></div><small>Chat: 1</small></div><div class="team blue"><h2>🔵 MAVİ</h2><div class="score" id="b">1000</div><div class="hp"><div class="bar" id="bb" style="width:100%"></div></div><small>Chat: 2</small></div></div><div class="feed" id="f"></div><div id="w" class="win hide"></div><script src="/socket.io/socket.io.js"></script><script>const s=io(),p=new URLSearchParams(location.search);let hp=[1000,1000],team=new Map(),feed=[];function draw(){r.textContent=hp[0];b.textContent=hp[1];rb.style.width=hp[0]/10+'%';bb.style.width=hp[1]/10+'%';f.innerHTML=feed.map(x=>'<div>'+x+'</div>').join('');if(hp[0]<=0||hp[1]<=0){w.textContent=(hp[0]>hp[1]?'🔴 KIRMIZI':'🔵 MAVİ')+' KAZANDI';w.classList.remove('hide')}}function event(e){if(e.type==='chat'){const n=String(e.comment||'').trim();if(n==='1'||n==='2')team.set(e.user?.uniqueId,Number(n)-1)}if(e.type==='gift'){const uid=e.user?.uniqueId||'x';const t=team.get(uid)??(Math.abs(Number(e.giftId||0))%2);const dmg=Math.min(120,5+Math.sqrt((e.diamondCount||1)*(e.repeatCount||1))*6);const target=t?0:1;hp[target]=Math.max(0,hp[target]-dmg);feed.unshift('🎁 '+(e.user?.nickname||uid)+' → '+(t?'🔵':'🔴')+' '+Math.round(dmg)+' hasar');feed=feed.slice(0,10);draw()}}s.on('live:event',event);s.on('live:gift',event);s.on('live:chat',event);draw();</script></body></html>
