<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGT Territory</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:system-ui;padding:20px}.top{display:flex;justify-content:space-between}.map{height:480px;margin-top:20px;border-radius:20px;border:2px solid #303746;display:grid;place-items:center;background:conic-gradient(from 90deg,#247cff 0 48%,#ff3d62 48% 100%);position:relative;overflow:hidden}.ball{position:absolute;font-size:24px;transition:all .5s}.legend{display:flex;gap:20px;margin-top:14px;font-size:18px}.feed{font-size:12px;opacity:.8}</style></head><body><div class="top"><b>🌍 AGT TERRITORY WAR</b><span>1=🔴 2=🔵</span></div><div class="map" id="map"></div><div class="legend"><span>🔴 <b id="red">50%</b></span><span>🔵 <b id="blue">50%</b></span></div><div class="feed" id="feed"></div><script src="/socket.io/socket.io.js"></script><script>const s=io(),map=document.getElementById('map');let team=new Map(),balls=[],area=[50,50];function addBall(t,name){const el=document.createElement('div');el.className='ball';el.textContent='⚪';map.appendChild(el);balls.push({el,t,x:Math.random()*90+5,y:Math.random()*80+10});return balls.at(-1)}function tick(){for(const b of balls){b.x+= (Math.random()-.5)*5;b.y+=(Math.random()-.5)*5;b.x=Math.max(3,Math.min(97,b.x));b.y=Math.max(8,Math.min(92,b.y));b.el.style.left=b.x+'%';b.el.style.top=b.y+'%'}area[0]=Math.max(5,Math.min(95,area[0]+(balls.filter(b=>b.t===0).length-balls.filter(b=>b.t===1).length)*.03));area[1]=100-area[0];red.textContent=area[0].toFixed(1)+'%';blue.textContent=area[1].toFixed(1)+'%'}function event(e){const uid=e.user?.uniqueId||'x';if(e.type==='chat'){const n=String(e.comment||'').trim();if(n==='1'||n==='2'){team.set(uid,Number(n)-1);addBall(Number(n)-1,e.user?.nickname)}}if(e.type==='gift'){const t=team.get(uid)??(Math.abs(Number(e.giftId||0))%2);const count=Math.max(1,Math.min(12,Math.ceil(Math.sqrt((e.diamondCount||1)*(e.repeatCount||1)))));for(let i=0;i<count;i++)addBall(t,e.user?.nickname);feed.textContent='🎁 '+(e.user?.nickname||uid)+' → '+(t?'🔵':'🔴')+' +'+count+' top'}}s.on('live:event',event);setInterval(tick,500);</script></body></html>
